name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Raw Compile Code File Bypass
      run: |
        # Find where the actual Swift code files are sitting
        APP_DIR=$(find . -name "NocturneApp.swift" -exec dirname {} \; | head -n 1)
        echo "Found code directory at: $APP_DIR"
        
        # Build a fresh, clean app bundle directory from scratch
        mkdir -p build/Nocturne.app
        
        # Compile all Swift files directly, completely skipping the broken project settings file
        xcrun -sdk iphoneos swiftc $(find "$APP_DIR" -name "*.swift") \
          -target arm64-apple-ios17.0 \
          -o build/Nocturne.app/Nocturne
          
        # Copy the asset catalog plist layout into the bundle if it exists
        find . -name "Info.plist" -exec cp {} build/Nocturne.app/Info.plist \; 2>/dev/null || true

    - name: Package IPA Manually
      run: |
        mkdir -p Payload
        cp -r build/Nocturne.app Payload/
        zip -r Nocturne.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nocturne-IPA
        path: Nocturne.ipa
