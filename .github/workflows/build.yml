name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Find Xcode Project
      run: |
        PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
        echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
        SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" | grep -A 5 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
        echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_ENV

    - name: Clean Project Map and Fix Targets
      run: |
        # Strip out explicit hardcoded resource links to missing assets
        sed -i '' '/impact.wav/d' "$PROJECT_PATH/project.pbxproj"
        sed -i '' '/hurt.wav/d' "$PROJECT_PATH/project.pbxproj"
        sed -i '' '/cast.wav/d' "$PROJECT_PATH/project.pbxproj"
        
        # This completely strips out duplicate target links for the source code causing the multiple commands error
        sed -i '' '/NocturneApp.swift/d' "$PROJECT_PATH/project.pbxproj" 2>/dev/null || true
        sed -i '' '/SpellEngine.swift/d' "$PROJECT_PATH/project.pbxproj" 2>/dev/null || true
        
        # Globally downscale deployment build metrics to target iOS 17.0
        sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 18.0/IPHONEOS_DEPLOYMENT_TARGET = 17.0/g' "$PROJECT_PATH/project.pbxproj"

    - name: Build Archive
      run: |
        # Added a special build setting to force Xcode to merge duplicate output items instead of crashing
        xcodebuild -project "$PROJECT_PATH" \
                   -scheme "$SCHEME_NAME" \
                   -configuration Release \
                   -sdk iphoneos \
                   -archivePath $PWD/build/Nocturne.xcarchive \
                   clean archive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PROVISIONING_PROFILE_SPECIFIER="" \
                   BUILD_BUILD_INTENTS_IN_PROCESS=YES \
                   COMPILER_INDEX_STORE_ENABLE=NO

    - name: Package IPA Manually
      run: |
        mkdir -p Payload
        cp -r build/Nocturne.xcarchive/Products/Applications/*.app Payload/
        zip -r Nocturne.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nocturne-IPA
        path: Nocturne.ipa
