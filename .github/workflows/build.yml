name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Find Xcode Project
      run: |
        PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
        echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
        SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" | grep -A 5 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
        echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_ENV

    - name: Destroy Duplicate Folders and Stripping
      run: |
        # Force delete any hidden or nested duplicate project folders completely
        find . -mindepth 2 -type d -name "Nocturne-Build" -exec rm -rf {} +
        find . -mindepth 2 -type d -name "Nocturne" -exec rm -rf {} + 2>/dev/null || true

        # Re-verify and strip missing audio items from the main project map file
        sed -i '' '/impact.wav/d' "$PROJECT_PATH/project.pbxproj"
        sed -i '' '/hurt.wav/d' "$PROJECT_PATH/project.pbxproj"
        sed -i '' '/cast.wav/d' "$PROJECT_PATH/project.pbxproj"
        
        # Globally force the targeting down to iOS 17.0
        sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 18.0/IPHONEOS_DEPLOYMENT_TARGET = 17.0/g' "$PROJECT_PATH/project.pbxproj"

    - name: Build Archive
      run: |
        xcodebuild -project "$PROJECT_PATH" \
                   -scheme "$SCHEME_NAME" \
                   -configuration Release \
                   -sdk iphoneos \
                   -archivePath $PWD/build/Nocturne.xcarchive \
                   clean archive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PROVISIONING_PROFILE_SPECIFIER=""

    - name: Package IPA Manually
      run: |
        mkdir -p Payload
        cp -r build/Nocturne.xcarchive/Products/Applications/*.app Payload/
        zip -r Nocturne.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nocturne-IPA
        path: Nocturne.ipa
